<!doctype html><html lang="fr" data-site-version="12"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rapports de raid</title>
<style>:root{--bg:#0a0918;--card:#121029;--card2:#0e0c22;--fg:#eeeaff;--muted:#9a94bd;--line:#29245a;--acc:#9b6bff;--accs:#9b6bff26;--good:#2ee6a6;--warn:#f6b73c;--bad:#ff6b81}
*{box-sizing:border-box}body{margin:0;color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 420px at 85% -5%,#3b1d8a55,transparent 70%),radial-gradient(700px 380px at 100% 10%,#0e5a7a33,transparent 70%),var(--bg);min-height:100vh}
a{color:inherit}.muted{color:var(--muted)}.small{font-size:13px}
.page{max-width:1420px;margin:auto;padding:26px 32px 40px}
.top{display:flex;align-items:center;gap:22px}.top .crest{width:60px;height:60px;flex:none}.crest .c1{fill:#6a3fe0}.crest .c2{fill:#2a1a6e}.crest .c3{fill:#d4c2ff}
.ttl{border-left:1px solid var(--line);padding-left:22px}.ttl h1{margin:0;font-size:36px;line-height:1.1;letter-spacing:-.01em}.grad{background:linear-gradient(90deg,#fff 0%,#c9a8ff 55%,#8f5bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--muted);font-size:15px;margin-top:2px}
.pnav{display:inline-flex;flex-wrap:wrap;gap:0;margin:26px 0 22px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--card2);position:static;border-bottom:1px solid var(--line)}
.pnav a,.pnav button{display:inline-flex;align-items:center;gap:10px;padding:10px 26px;border-radius:10px;text-decoration:none;font:inherit;font-size:15px;color:var(--fg);background:none;border:0;cursor:pointer}
.pnav svg{width:20px;height:20px;fill:var(--acc)}.pnav a.on,.pnav button.on{background:linear-gradient(90deg,#4b2fb8,#2f1f86);box-shadow:inset 0 -2px 0 #9b6bff,0 0 18px #6a3fe055;font-weight:600}.pnav .on svg{fill:#fff}
.pnav .d{margin-right:-2px}.pn{color:var(--cc)!important}
.panel{border:1px solid #2f2a6e;border-radius:18px;padding:14px;background:linear-gradient(180deg,#14113a99,#0c0a22cc);box-shadow:0 0 0 1px #00000040,0 20px 60px #00000055}
.inner{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;background:#0c0a2299}
.shero{position:relative;display:grid;grid-template-columns:1fr 380px;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:176px;background:var(--card2)}
.shero>.ban{position:absolute;inset:0;height:auto;opacity:.75;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 35%,#000 70%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 35%,#000 70%,transparent 100%)}.shero>.ban span{font-size:170px;right:420px;bottom:-30px;color:#ffffff12}
.hl,.hr{position:relative;padding:22px 26px}.hd{display:flex;align-items:center;gap:10px;color:var(--fg);opacity:.85;font-size:15px}.hl h2{font-size:38px;margin:6px 0 10px;line-height:1.1}.hs{display:flex;align-items:center;gap:10px;font-size:19px;color:#c9c2f0}.hs b{color:var(--muted)}
.hr{display:flex;flex-direction:column;justify-content:center;gap:10px}.hr:before{content:"";position:absolute;left:0;top:16px;bottom:16px;border-left:1px solid var(--line)}.hk{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#c9c2f0;font-weight:600}
.hn{font-size:58px;font-weight:800;line-height:1}.hn span{font-size:26px;font-weight:500;color:var(--muted);margin-left:6px}.hn.good{color:var(--good)}.hn.warn{color:var(--warn)}.hn.bad{color:var(--bad)}
.bar10{height:9px;border-radius:9px;background:#2a2560;overflow:hidden}.bar10 i{display:block;height:100%;border-radius:9px;background:var(--good)}.bar10.warn i{background:var(--warn)}.bar10.bad i{background:var(--bad)}.hv{font-weight:600}.hv.good{color:var(--good)}.hv.warn{color:var(--warn)}.hv.bad{color:var(--bad)}
.btn{display:inline-block;margin-top:14px;font-size:14px;border:1px solid var(--acc);color:var(--fg);background:#5b3fc433;border-radius:10px;padding:7px 14px;text-decoration:none;cursor:pointer;font-family:inherit}.btn:hover{background:#5b3fc466}
.ico{width:22px;height:22px;fill:currentColor;flex:none;opacity:.9}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 4px 14px}.sechead h2{display:flex;align-items:center;gap:12px;margin:0;font-size:24px}.sechead h2 .ico{width:30px;height:30px}
.leg{display:flex;gap:18px;font-size:14px;color:#c9c2f0}.leg span{display:inline-flex;gap:8px;align-items:center}.d{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}.d.kill{background:var(--good)}.d.best{background:var(--warn)}.d.none{background:#5b567a}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.btile{display:block;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--fg);cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}.btile:hover{transform:translateY(-2px);border-color:#7b5cff;box-shadow:0 8px 26px #6a3fe033}.btile.off{opacity:.55;cursor:default}.btile.off:hover{transform:none;border-color:var(--line);box-shadow:none}
.ban{position:relative;height:138px;background:radial-gradient(circle at var(--x) var(--y),hsl(var(--a) 85% 58%/.8),transparent 55%),radial-gradient(circle at 85% 80%,hsl(var(--b) 80% 48%/.75),transparent 50%),linear-gradient(135deg,hsl(var(--a) 60% 17%),hsl(var(--b) 65% 9%));overflow:hidden}.ban span{position:absolute;right:16px;bottom:-16px;font-size:84px;font-weight:900;color:#ffffff1f;letter-spacing:-.04em}
.bt{padding:16px 18px 18px}.bt h3{margin:0 0 12px;font-size:19px}.bt hr{border:0;border-top:1px solid var(--line);margin:14px 0 12px}
.st{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 14px 4px 8px;border-radius:999px;border:1.5px solid}.st i{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-style:normal;font-size:12px}
.st.kill{color:var(--good);border-color:#2ee6a688;background:#2ee6a612}.st.kill i{background:var(--good);color:#06281c}.st.best{color:var(--warn);border-color:#f6b73c99;background:#f6b73c12}.st.best i{color:var(--warn);font-size:16px}.st.none{color:var(--muted);border-color:#4a4570;padding-left:12px}
.big{font-size:30px;font-weight:800;color:var(--warn);line-height:1.1;margin-top:-2px}.bf{margin:2px 0 0;font-size:14px;color:var(--muted)}
.car{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin:0 0 6px}.sc{flex:0 0 auto;display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;color:var(--fg);font:inherit;cursor:pointer}.sc span{font-size:12px;color:var(--muted)}.sc em{font-style:normal;font-weight:800}.sc em.good{color:var(--good)}.sc em.warn{color:var(--warn)}.sc em.bad{color:var(--bad)}.sc.on{border-color:var(--acc);box-shadow:0 0 0 2px #9b6bff44}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;color:#c9c2f0;font-size:14px}.foot>span{display:inline-flex;gap:10px;align-items:center}.foot .ico{width:20px;height:20px;fill:var(--acc)}
.bestg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.bcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center}.bcard .bn{font-weight:800;font-size:18px;margin:6px 0 2px}.bcard .bs{font-size:28px;font-weight:800}.bcard .bs span{font-size:14px;color:var(--muted);margin-left:3px}.bs.good{color:var(--good)}.bs.warn{color:var(--warn)}.bs.bad{color:var(--bad)}.plbl{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--warn);text-transform:uppercase}.inner .podium{margin:4px 0}
.mth{padding:18px}.mflow{display:flex;align-items:stretch;gap:12px;flex-wrap:wrap;margin-bottom:16px}.mflow>i{align-self:center;font-style:normal;color:var(--acc);font-size:22px}.mstep{flex:1 1 220px;display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.mstep>b{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6a3fe0,#3a2a8a);font-size:16px}.mstep h3{margin:0 0 2px;font-size:16px}.mstep p{margin:0;font-size:14px;color:#c9c2f0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}.mcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px 18px}.mcard h3{margin:0 0 8px;font-size:17px}.mcard p{margin:6px 0;font-size:14px;line-height:1.55}.mcard ul{margin:6px 0 0;padding-left:18px}.mcard li{margin:4px 0}
.mkpi{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.mkpi>div{flex:1 1 90px;background:#0a0918;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}.mkpi b{display:block;font-size:22px;color:var(--acc)}.mkpi span{font-size:12px;color:var(--muted)}
.mline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px}.mline span{padding:3px 9px;border-radius:999px;background:#0a0918;border:1px solid var(--line)}.mline span.hit{border-color:var(--warn);color:var(--warn)}.mline span.off{opacity:.45;text-decoration:line-through}.mline i{flex:0 0 18px;height:2px;background:var(--acc)}.mline i.off{background:var(--line)}
.msplit{display:flex;height:30px;border-radius:9px;overflow:hidden;margin:10px 0;font-size:12px;font-weight:700}.msplit i{display:grid;place-items:center;font-style:normal;background:#6a3fe0}.msplit i+i{background:#2ee6a6;color:#06281c}
.tw{overflow-x:auto}.rtab{border-collapse:collapse;width:100%;font-size:14px}.rtab th,.rtab td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}.rtab th{color:var(--muted);font-weight:600;cursor:pointer;font-size:13px;vertical-align:bottom}.rtab th.num,.rtab td.num{text-align:center}.rtab tbody tr:hover{background:#ffffff08}.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0}
.nlink{text-decoration:none;border-radius:999px;display:inline-block}.nlink:hover .nchip,.nlink:focus-visible .nchip{box-shadow:0 0 0 1.5px currentColor}.nchip{display:inline-block;min-width:38px;padding:2px 8px;border-radius:999px;font-weight:700;font-size:13px}.nchip.good{background:#2ee6a61f;color:var(--good)}.nchip.warn{background:#f6b73c1f;color:var(--warn)}.nchip.bad{background:#ff6b811f;color:var(--bad)}.nchip.strong{box-shadow:inset 0 0 0 1.5px currentColor}
.bpills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.bp{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}.bp.on{background:linear-gradient(90deg,#4b2fb8,#2f1f86);border-color:#7b5cff}.bp.off{opacity:.45;cursor:default}
.mkpi2{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}.mk{background:#0a0918;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.mk b{display:block;font-size:24px;color:var(--fg)}.mk span{font-size:12px;color:var(--muted)}
.prose{max-width:820px;padding:8px 26px 20px}.prose h3{margin:22px 0 6px;font-size:17px}.prose li{margin:4px 0}
@media(max-width:900px){.mflow>i{display:none}.mgrid{grid-template-columns:1fr}.page{padding:16px}.top{gap:14px}.top .crest{width:42px;height:42px}.ttl{padding-left:14px}.ttl h1{font-size:26px}.shero{grid-template-columns:1fr}.hr:before{left:16px;right:16px;top:0;bottom:auto;border-left:0;border-top:1px solid var(--line)}.hl h2{font-size:28px}.hn{font-size:44px}.pnav a,.pnav button{padding:9px 14px}}</style></head>
<body><div class="page">
<header class="top"><svg class="crest" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 54 12v18c0 15-9.6 25.6-22 30C19.6 55.6 10 45 10 30V12z" class="c1"/><path d="M32 13 46 18.5V30c0 9.6-5.8 17-14 20.6C23.8 47 18 39.6 18 30V18.5z" class="c2"/><path d="M32 20l4 8 8 1-6 6 1.6 8L32 39l-7.6 4 1.6-8-6-6 8-1z" class="c3"/></svg>
<div class="ttl"><h1><span class="grad">Rapports</span> de raid</h1><div class="sub" id="sub">Analyses Warcraft Logs générées par Raid Analyzer et mises à jour automatiquement.</div></div></header>
<nav class="pnav"><a href="#/" data-r="/"><svg viewBox="0 0 24 24"><path d="M4 3l7 7-1.5 1.5L3 5V3zm16 0v2l-6.5 6.5L12 10l7-7zM8.5 13.5l2 2L6 20l-1-1-2 1 1-2-1-1zm7 0L21 19l-1 1 1 2-2-1-1 1-4.5-4.5z"/></svg>Soirées</a><a href="#/recap" data-r="/recap"><svg viewBox="0 0 24 24"><path d="M3 4h18v3H3zm0 6h18v3H3zm0 6h18v3H3z"/></svg>Récapitulatif</a><a href="#/methode" data-r="/methode"><svg viewBox="0 0 24 24"><path d="M4 20V12h3v8zm6.5 0V7h3v13zM17 20V3h3v17z"/></svg>Méthode</a></nav>
<div id="app"><p class="muted">Chargement…</p></div>
<footer class="foot"><span id="fcount"></span><span class="muted">Raid Analyzer, par Endloril &amp; Dalrkïra</span><span id="fsync"></span></footer></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const day=t=>t?new Date(t).toLocaleDateString("fr-BE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"?";
const sday=t=>t?new Date(t).toLocaleDateString("fr-BE",{weekday:"short",day:"numeric",month:"short"}):"?";
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s, fr=v=>v==null?"—":Number(v).toLocaleString("fr-BE",{maximumFractionDigits:1});
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const banner=n=>{const h=hash(n),a=180+h%150,b=180+(h>>8)%150,x=20+(h>>4)%60,y=20+(h>>12)%50;return '<div class="ban" style="--a:'+a+';--b:'+b+';--x:'+x+'%;--y:'+y+'%"><span>'+esc(String(n).replace(/^the\s+/i,"").split(/[\s,']/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase())+'</span></div>'};
const lvl=n=>n==null?"":n>=6.5?"good":n>=5?"warn":"bad", verdict=n=>n==null?"":n>=8?"Très bonne soirée":n>=6.5?"Bonne soirée":n>=5?"Soirée correcte":"Soirée difficile";
const SKULL='<svg class="ico" viewBox="0 0 24 24"><path d="M12 2C7 2 3.5 5.6 3.5 10.2c0 2.7 1.3 4.6 3 5.8V19a1 1 0 0 0 1 1h1v-2h1.5v2h4v-2H15.5v2h1a1 1 0 0 0 1-1v-3c1.7-1.2 3-3.1 3-5.8C20.5 5.6 17 2 12 2zM8.5 13.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm7 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>';
const CAL='<svg class="ico" viewBox="0 0 24 24"><path d="M7 2v2H4a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-3V2h-2v2H9V2zM5 9h14v10H5z"/></svg>';
const CC={DeathKnight:"#C41E3A",DemonHunter:"#A330C9",Druid:"#FF7C0A",Evoker:"#33937F",Hunter:"#AAD372",Mage:"#3FC7EB",Monk:"#00FF98",Paladin:"#F48CBA",Priest:"#FFFFFF",Rogue:"#FFF468",Shaman:"#0070DD",Warlock:"#8788EE",Warrior:"#C69B6D"};
let data=null,sel=0;
async function load(){if(data)return data;try{const r=await fetch("rapports/index.json?"+Date.now());data=r.ok?await r.json():[]}catch(e){data=[]}
  const g=data.find(x=>x.guild);if(g){document.getElementById("sub").innerHTML="&lt;"+esc(g.guild)+"&gt;"+(g.server?" · "+esc(g.server):"")+" — analyses Warcraft Logs générées par Raid Analyzer et mises à jour automatiquement.";document.title="Rapports de raid — "+g.guild}
  document.getElementById("fcount").innerHTML=CAL+data.length+" soirée"+(data.length>1?"s":"")+" publiée"+(data.length>1?"s":"");
  const live=data.find(x=>x.auto),last=Math.max(0,...data.map(x=>x.generated||0));
  document.getElementById("fsync").innerHTML='<svg class="ico" viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 1 7.4 5H17v2h6V5h-2v2.3A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8zm8 8a8 8 0 0 1-15.4 3H7v-2H1v6h2v-2.3A10 10 0 0 0 22 12z"/></svg>Dernière synchronisation : '+(live?"mise à jour en cours"+(live.next_update?" (prochaine vers "+new Date(live.next_update).toLocaleTimeString("fr-BE",{hour:"2-digit",minute:"2-digit"})+")":""):last?new Date(last).toLocaleString("fr-BE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—");
  return data}
const METHODE='<div class="panel mth"><section class="mflow"><div class="mstep"><b>1</b><div><h3>Un lien</h3><p>On colle le lien du rapport Warcraft Logs dans Claude.</p></div></div><i>→</i><div class="mstep"><b>2</b><div><h3>Toute la soirée</h3><p>Chaque boss et chaque pull sont analysés, kills compris.</p></div></div><i>→</i><div class="mstep"><b>3</b><div><h3>Mise à jour seule</h3><p>Nouveaux pulls et données manquantes ajoutés jusqu’à la clôture.</p></div></div></section><div class="mgrid"><article class="mcard"><h3>📊 Note d’un joueur</h3><p>Chaque joueur est comparé à la moyenne du raid sur le même pull, mécanique par mécanique. Un écart ne compte que s’il est régulier :</p><div class="mkpi"><div><b>1,5×</b><span>la moyenne du raid</span></div><div><b>30 %</b><span>des pulls au moins</span></div><div><b>1 %</b><span>des dégâts subis</span></div></div><p class="muted small">Pénalités plafonnées à 2,5 points par mécanique ; note de 1 à 10.</p></article><article class="mcard"><h3>✂️ Ce qui est gardé d’un wipe</h3><p>Le pull est analysé jusqu’à l’événement qui le cause, plus le fail suivant. La suite n’est reprochée à personne.</p><div class="mline"><span>Pull</span><i></i><span class="hit">2e mort, tank non relevé ou 1er fail majeur</span><i></i><span class="hit">fail suivant</span><i class="off"></i><span class="off">ignoré</span></div></article><article class="mcard"><h3>💀 Morts</h3><p>Signalé quand un joueur meurt nettement plus que le raid, régulièrement.</p><div class="mkpi"><div><b>2×</b><span>le raid, sur 3 pulls</span></div><div><b>1,25×</b><span>pour un tank, sur 2 pulls</span></div></div></article><article class="mcard"><h3>🎯 Gameplay et stuff</h3><p>Healers, DPS et tanks sont comparés aux meilleurs logs mondiaux de leur spé, sur le même boss et la même difficulté.</p><p class="small"><b>Note d’un fight</b> = moyenne pondérée de catégories notées sur 10, selon le rôle. DPS : strat, dégâts, survie, gameplay. Healer : strat, soins, survie, gameplay (poids 1), dégâts (poids 0,25). Tank : strat, mitigation et survie, gameplay (poids 1), dégâts et soins (poids 0,5). Les morts comptent dans la survie, pas dans la strat.</p><p class="muted small">Buffs d’avant pull et bijoux exclus ; enchantements vérifiés par rapport au raid et au top.</p></article><article class="mcard"><h3>🏆 Classements</h3><p>Pour chaque boss et pour toute la soirée : meilleur tank, meilleur healer, meilleur DPS mêlée et meilleur DPS distance.</p><p class="muted small">Soirée : note moyenne de tous les pulls de chaque joueur, puis morts par pull.</p></article><article class="mcard"><h3>🔄 Mise à jour</h3><p>Pendant et après la soirée, le rapport se complète tout seul.</p><ul class="small"><li>Données manquantes : nouvel essai après la remise à zéro du quota.</li><li>Pulls en cours : vérification toutes les 10 min.</li><li>Clôturé quand tout est chargé et qu’aucun pull n’a été ajouté depuis 1 h.</li></ul></article></div></div>';
function tile(b,file){const st=!b.tried?'<span class="st none">○ Non tenté</span>':b.kills?'<span class="st kill"><i>✓</i>Vaincu</span>':'<span class="st best"><i>◎</i>Meilleure tentative</span>';
  const ft=!b.tried?'<p class="bf">Pas tenté cette soirée.</p>':b.kills?'<p class="bf">Boss vaincu cette soirée.</p>':'<div class="big">'+fr(b.best_pct)+' %</div><p class="bf">PV restants au plus bas</p>';
  const inner=banner(b.name)+'<div class="bt"><h3>'+esc(b.name)+'</h3>'+st+'<hr>'+ft+'</div>';return b.key?'<a class="btile" href="'+esc(file)+'#'+esc(b.key)+'">'+inner+'</a>':'<div class="btile off">'+inner+'</div>'}
function soirees(list){const x=list[sel]||list[0],bs=x.bosses||[],k=bs.filter(b=>b.kills).length;
  const car=list.length>1?'<div class="car">'+list.map((e,i)=>'<button class="sc'+(i===sel?" on":"")+'" data-i="'+i+'"><span>'+esc(sday(e.raid_date))+'</span><b>'+esc(e.zone||e.title)+'</b><em class="'+lvl(e.note)+'">'+fr(e.note)+'</em></button>').join("")+'</div>':"";
  const hero='<section class="shero">'+banner(x.zone||x.title)+'<div class="hl"><div class="hd">'+CAL+esc(cap(day(x.raid_date)))+'</div><h2>'+esc(x.zone||x.title)+'</h2><div class="hs">'+SKULL+k+' boss vaincu'+(k>1?"s":"")+' <b>·</b> '+(x.pulls??"?")+' pulls</div><a class="btn" href="'+esc(x.file)+'">Ouvrir le rapport complet →</a></div><div class="hr"><div class="hk">Note du raid</div><div class="hn '+lvl(x.note)+'">'+fr(x.note)+'<span>/10</span></div><div class="bar10 '+lvl(x.note)+'"><i style="width:'+((x.note??0)*10)+'%"></i></div><div class="hv '+lvl(x.note)+'">🏆 '+esc(verdict(x.note))+'</div></div></section>';
  const RB=[["Meilleur tank",q=>q.role==="tank"],["Meilleur healer",q=>q.role==="healer"],["Meilleur DPS mêlée",q=>q.role==="dps"&&q.sub==="melee"],["Meilleur DPS distance",q=>q.role==="dps"&&q.sub!=="melee"]];
  const pl=[...(x.players||[])].sort((a,b)=>(b.note??0)-(a.note??0)||(b.pulls??0)-(a.pulls??0));
  const bestc=RB.map(([l,ok])=>{const q=pl.find(ok);return q?'<div class="bcard"><div class="plbl">🏆 '+l+'</div><div class="bn" style="color:'+(CC[String(q.class||"").replace(/\s/g,"")]||"#ccc")+'">'+esc(q.name)+'</div><div class="bs '+lvl(q.note)+'">'+fr(q.note)+'<span>/10</span></div><div class="bf">'+(q.pulls??"?")+' pulls</div></div>':""}).join("");
  const best=bestc?'<section class="inner"><div class="sechead"><h2>🏆 Les meilleurs de la soirée</h2></div><div class="bestg">'+bestc+'</div></section>':"";
  return car+'<div class="panel">'+hero+best+'<section class="inner"><div class="sechead"><h2>'+SKULL+'Progression des boss</h2><div class="leg"><span><i class="d kill"></i>Vaincu</span><span><i class="d best"></i>Meilleure tentative</span></div></div><div class="bgrid">'+bs.map(b=>tile(b,x.file)).join("")+'</div></section></div>'}
let bsel=null;
const avg=a=>{const v=a.filter(x=>x!=null);return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length*10)/10:null};
const cn=(v,href)=>v==null?'<td class="num" data-v="-1"><span class="muted">—</span></td>':'<td class="num" data-v="'+v+'">'+(href?'<a class="nlink" href="'+esc(href)+'" title="Voir le détail de cette note">':'')+'<span class="nchip '+lvl(v)+'">'+fr(v)+'</span>'+(href?'</a>':'')+'</td>';
const golink=(file,...parts)=>file?file+'#go='+encodeURIComponent(parts.join('|')):null;
const pname=p=>'<td data-v="'+esc(p.name)+'"><span class="pdot" style="background:'+(CC[String(p.class||"").replace(" ","")]||"#888")+'"></span>'+esc(p.name)+'</td>';
function recap(list){
  const L=[...list].sort((a,b)=>(a.raid_date||0)-(b.raid_date||0));
  const head=L.map(e=>'<th class="num" title="'+esc(e.zone||e.title)+'">'+esc(sday(e.raid_date))+'</th>').join("");
  const names=new Map();for(const e of L)for(const p of e.players||[])if(!names.has(p.name))names.set(p.name,p);
  const rows=[...names.values()].map(p=>{const v=L.map(e=>(e.players||[]).find(x=>x.name===p.name)?.note??null);return{p,v,a:avg(v),n:v.filter(x=>x!=null).length}}).sort((a,b)=>(b.a??-1)-(a.a??-1));
  const t1='<section class="inner"><div class="sechead"><h2>Note des joueurs, soirée par soirée</h2><span class="muted small">'+L.length+' soirée'+(L.length>1?"s":"")+' · moyenne des soirées où le joueur était présent · clique une note pour son détail, un en-tête pour trier</span></div><div class="tw"><table class="rtab sortable"><thead><tr><th>Joueur</th>'+head+'<th class="num">Moyenne</th><th class="num">Soirées</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+pname(r.p)+r.v.map((v,i)=>cn(v,golink(L[i].file,"m",r.p.name))).join("")+cn(r.a).replace("nchip","nchip strong")+'<td class="num" data-v="'+r.n+'">'+r.n+'</td></tr>').join("")+'</tbody></table></div></section>';
  const order=[];for(const e of [...L].reverse())for(const b of e.bosses||[])if(!order.includes(b.name))order.push(b.name);
  const tried=order.filter(n=>L.some(e=>(e.bosses||[]).some(b=>b.name===n&&b.tried)));
  if(!bsel||!tried.includes(bsel))bsel=tried[0];
  let t2='<section class="inner"><div class="sechead"><h2>Par boss</h2><span class="muted small">Basé sur tous les rapports publiés · clique une note pour son détail</span></div>';
  if(!tried.length)return '<div class="panel">'+t1+t2+'<p class="muted">Aucun boss tenté pour l’instant.</p></section></div>';
  t2+='<div class="bpills">'+order.map(n=>{const ok=tried.includes(n),k=L.some(e=>(e.bosses||[]).some(b=>b.name===n&&b.kills));return '<button class="bp'+(n===bsel?" on":"")+(ok?"":" off")+'" data-b="'+esc(n)+'"'+(ok?"":" disabled")+'><i class="d '+(k?"kill":ok?"best":"none")+'"></i>'+esc(n)+'</button>'}).join("")+'</div>';
  const S=L.map(e=>({e,b:(e.bosses||[]).find(b=>b.name===bsel&&b.tried)})).filter(x=>x.b);
  const pulls=S.reduce((a,x)=>a+(x.b.pulls||0),0),kills=S.reduce((a,x)=>a+(x.b.kills||0),0),fk=S.find(x=>x.b.kills);
  const bests=S.filter(x=>!x.b.kills&&x.b.best_pct!=null).map(x=>x.b.best_pct);
  const kp=(v,l)=>'<div class="mk"><b>'+v+'</b><span>'+l+'</span></div>';
  t2+='<div class="mkpi2">'+kp(S.length,"soirée"+(S.length>1?"s":"")+" sur ce boss")+kp(pulls,"pulls au total")+kp(kills?"✓ "+kills:"—","kill"+(kills>1?"s":""))+kp(fk?esc(sday(fk.e.raid_date)):(bests.length?fr(Math.min(...bests))+" %":"—"),fk?"premier kill":"meilleur essai")+'</div>';
  const bn=new Map();for(const x of S)for(const p of x.b.players||[])if(!bn.has(p.name))bn.set(p.name,p);
  const br=[...bn.values()].map(p=>{const v=S.map(x=>(x.b.players||[]).find(y=>y.name===p.name)?.note??null);const w=S.map(x=>(x.b.players||[]).find(y=>y.name===p.name)?.pulls??0);const tw=w.reduce((a,b)=>a+b,0);const wa=tw?Math.round(S.reduce((a,x,i)=>a+(v[i]??0)*w[i],0)/tw*10)/10:null;return{p,v,a:wa,t:tw}}).sort((a,b)=>(b.a??-1)-(a.a??-1));
  t2+='<div class="tw"><table class="rtab sortable"><thead><tr><th>Joueur</th>'+S.map(x=>'<th class="num">'+esc(sday(x.e.raid_date))+'<br><small class="muted">'+(x.b.kills?"✓ vaincu":fr(x.b.best_pct)+" %")+' · '+(x.b.pulls??"?")+' pulls</small></th>').join("")+'<th class="num">Moyenne</th><th class="num">Pulls</th></tr></thead><tbody>'+br.map(r=>'<tr>'+pname(r.p)+r.v.map((v,i)=>cn(v,S[i].b.key?golink(S[i].e.file,"p",S[i].b.key,r.p.name,r.p.role||""):golink(S[i].e.file,"m",r.p.name))).join("")+cn(r.a).replace("nchip","nchip strong")+'<td class="num" data-v="'+r.t+'">'+r.t+'</td></tr>').join("")+'</tbody></table></div><p class="muted small">Moyenne sur ce boss pondérée par le nombre de pulls de chaque soirée.</p></section>';
  return '<div class="panel">'+t1+t2+'</div>'}
async function route(){const r=location.hash.replace(/^#/,"")||"/";document.querySelectorAll(".pnav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r));const app=document.getElementById("app");
  const list=await load();if(r==="/methode"){app.innerHTML=METHODE;return}
  if(!list.length){app.innerHTML='<p class="muted">Aucun rapport publié pour l\'instant.</p>';return}app.innerHTML=r==="/recap"?recap(list):soirees(list)}
document.addEventListener("click",e=>{const b=e.target.closest(".sc");if(b){sel=+b.dataset.i;route();return}const q=e.target.closest(".bp");if(q&&!q.disabled){bsel=q.dataset.b;route();return}const th=e.target.closest("table.sortable th");if(th){const i=[...th.parentNode.children].indexOf(th),tb=th.closest("table").tBodies[0],rs=[...tb.rows],asc=th.dataset.asc!=="1";th.dataset.asc=asc?"1":"0";rs.sort((a,b)=>{const x=a.cells[i].dataset.v,y=b.cells[i].dataset.v,nx=parseFloat(x),ny=parseFloat(y);const c=(!isNaN(nx)&&!isNaN(ny))?nx-ny:String(x).localeCompare(y,"fr");return asc?c:-c});rs.forEach(r=>tb.appendChild(r))}});
addEventListener("hashchange",route);route();
</script></body></html>
